openapi: 3.1.0

# WinterChat HTTP API — PROPOSED, pending acceptance (see DECISIONS.md D-021).
#
# Every path below traces to a recorded feature or decision. Anything that would
# require an unrecorded choice is marked `x-pending-decision` and left unspecified
# rather than invented (CLAUDE.md §3.2).
#
# Not covered here: inbound realtime delivery to the browser, which is a Supabase
# Realtime subscription, not an HTTP endpoint (D-005).

info:
  title: WinterChat API
  version: 0.1.0-draft
  description: |
    Admin console for a LINE Official Account: read inbound messages, reply, and view
    a stats summary. Single shared access code, no per-user accounts (D-002, D-009).

    All timestamps are RFC 3339 UTC. Calendar-day boundaries for dashboard windows are
    Asia/Bangkok (D-014).

servers:
  - url: /api

tags:
  - name: auth
    description: F-001 workspace login
  - name: conversations
    description: F-002 contact list, status, search
  - name: messages
    description: F-002 thread history and sending
  - name: webhook
    description: F-002 LINE inbound
  - name: dashboard
    description: F-003 summary

security:
  - sessionCookie: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Exchange the workspace access code for a session
      description: |
        D-002, D-008, D-011, D-017. On success sets a signed httpOnly secure cookie with
        a 7-day lifetime. The code itself does not expire and is not single-use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Compared against the ACCESS_CODE environment variable.
      responses:
        '204':
          description: Authenticated. Session cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Signed, httpOnly, Secure, SameSite=Lax, Max-Age 604800.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Missing or empty code.
        '401':
          description: Incorrect code. Response body is identical for every wrong code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: INVALID_ACCESS_CODE, message: That access code didn't work, ref: 4471-A } }
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [auth]
      summary: Clear the session
      description: D-008.
      responses:
        '204':
          description: Cookie cleared. Idempotent — succeeds with no session present.

  /auth/session:
    get:
      tags: [auth]
      summary: Check whether the caller holds a valid session
      description: Used by middleware and the client shell to route to login.
      responses:
        '200':
          description: Session valid.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, expiresAt]
                properties:
                  authenticated: { type: boolean, const: true }
                  expiresAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /conversations:
    get:
      tags: [conversations]
      summary: List conversations, most recently active first
      description: |
        F-002 items 1, 7, 8. `search` matches contact display name and message text
        (D-019). Filtering and search compose.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ConversationStatus' }
          description: Omit for the All filter.
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
          description: Empty string is treated as absent.
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
          x-pending-decision: OQ-16
          description: Default page size not yet decided.
      responses:
        '200':
          description: A page of conversations.
          content:
            application/json:
              schema:
                type: object
                required: [items, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConversationSummary' }
                  nextCursor:
                    type: [string, 'null']
                  totals:
                    type: object
                    description: Backs the list footer count line.
                    required: [matching, all, open]
                    properties:
                      matching: { type: integer }
                      all: { type: integer }
                      open: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [conversations]
      summary: Conversation detail for the thread header and details panel
      responses:
        '200':
          description: Conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [conversations]
      summary: Change conversation status
      description: D-019. The only mutable field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ConversationStatus' }
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversationId}/read:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [conversations]
      summary: Mark every inbound message in this conversation as read
      description: |
        D-007 — opening a thread marks all of it read. Read state is workspace-wide and
        shared across all signed-in admins (D-009). Idempotent.
      responses:
        '204': { description: Marked read. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [messages]
      summary: Thread history, newest last, paged backwards
      description: F-002 item 3. Backs the design's "Load full history" control.
      parameters:
        - name: before
          in: query
          schema: { type: string }
          description: Cursor — return messages older than this.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
          x-pending-decision: OQ-16
          description: Initial load count and page size not yet decided.
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  hasMore: { type: boolean }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [messages]
      summary: Send an outbound text message
      description: |
        D-006 — attempts the LINE Reply API when an unused reply token exists, and falls
        back to Push on any error. D-010 — text only. D-013 — the message is created
        `sending` and resolves to `sent` or `failed`; the resolution reaches the client
        over Supabase Realtime (D-005), not in this response.

        `closeAfterSend` implements the design's "Send & close" (D-019): status becomes
        `Closed` only if the send itself succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, clientId]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: |
                    Rejected when empty or whitespace-only. Upper bound is the LINE text
                    message limit.
                clientId:
                  type: string
                  format: uuid
                  description: |
                    Client-generated id for the optimistic bubble, and the idempotency
                    key — a repeat of the same clientId returns the original message
                    rather than sending twice.
                closeAfterSend:
                  type: boolean
                  default: false
      responses:
        '202':
          description: Accepted. Message persisted with deliveryStatus `sending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Empty text, oversized text, or missing clientId.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}/retry:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [messages]
      summary: Retry a failed outbound message
      description: D-013. Only valid from `failed`.
      responses:
        '202':
          description: Retry accepted; deliveryStatus returns to `sending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Message is not in `failed`, or is inbound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /line/webhook:
    post:
      tags: [webhook]
      summary: LINE Messaging API inbound webhook
      description: |
        D-012 — the `X-Line-Signature` HMAC is verified against the channel secret on
        every request. Events are deduped by LINE event id. D-010 — non-text messages
        are stored as a typed placeholder. D-013 — the contact profile is fetched on
        first contact, and a profile-API failure must not block storing the message.

        Returns 2xx promptly on accepted events so LINE does not retry.
      security: []
      parameters:
        - name: X-Line-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: LINE webhook event payload. Shape is defined by LINE, not here.
              required: [destination, events]
              properties:
                destination: { type: string }
                events: { type: array, items: { type: object } }
      responses:
        '200': { description: Events accepted, or ignored as duplicates. }
        '400': { description: Malformed payload. Not retried by LINE. }
        '401': { description: Missing, malformed, or incorrect signature. Nothing is written. }

  /dashboard/summary:
    get:
      tags: [dashboard]
      summary: Stats overview
      description: |
        F-003, D-014, D-020. Only metrics F-003 specifies. Empty data yields zeros,
        never placeholders (CLAUDE.md §3.5).
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [today, 7d], default: today }
          description: Asia/Bangkok calendar days. The design's 30d range is out of scope.
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wc_session
      description: Signed httpOnly session cookie set by POST /auth/login (D-008).

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid session cookie.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many failed attempts from this IP (D-011).
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until attempts are accepted again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, SCREAMING_SNAKE_CASE.
            message:
              type: string
              description: Human-readable, safe to display.
            ref:
              type: string
              description: |
                Short support reference, surfaced in the design's error cards
                ("error INVITE_INVALID · ref 4471-A").

    ConversationStatus:
      type: string
      enum: [Open, Pending, Closed]
      description: D-019.
      x-pending-decision: OQ-17

    DeliveryStatus:
      type: string
      enum: [sending, sent, failed]
      description: D-013. Outbound only; inbound messages have no delivery status.

    MessageDirection:
      type: string
      enum: [inbound, outbound]

    Contact:
      type: object
      required: [id, lineUserId, displayName, firstSeenAt]
      properties:
        id: { type: string }
        lineUserId:
          type: string
          description: Shown truncated in the details panel ("U8f2c…4471").
        displayName:
          type: string
          description: |
            From the LINE profile API, cached (D-013). Falls back to the LINE user id
            when the profile fetch failed.
        avatarUrl: { type: [string, 'null'], format: uri }
        firstSeenAt: { type: string, format: date-time }

    ConversationSummary:
      type: object
      description: A row in the conversation list.
      required: [id, contact, status, unread, lastMessageAt, channel]
      properties:
        id: { type: string }
        contact: { $ref: '#/components/schemas/Contact' }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        unread:
          type: boolean
          description: Drives the row's unread dot (D-007).
        unreadCount: { type: integer, minimum: 0 }
        snippet:
          type: string
          description: Text of the most recent message.
        lastMessageAt: { type: string, format: date-time }
        channel:
          type: string
          const: LINE
          description: Always LINE — other channels are inert chrome (D-018).

    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          properties:
            messageCount: { type: integer }

    Message:
      type: object
      required: [id, conversationId, direction, createdAt, messageType]
      properties:
        id: { type: string }
        conversationId: { type: string }
        clientId:
          type: [string, 'null']
          description: Echoes the sender's optimistic id so the bubble can be reconciled.
        direction: { $ref: '#/components/schemas/MessageDirection' }
        messageType:
          type: string
          description: |
            LINE message type. `text` is the only supported type; anything else is stored
            as a placeholder and rendered as unsupported (D-010).
          examples: [text, image, sticker, location]
        text:
          type: [string, 'null']
          description: Null for non-text inbound placeholders.
        deliveryStatus:
          oneOf:
            - $ref: '#/components/schemas/DeliveryStatus'
            - type: 'null'
          description: Outbound only.
        failureReason:
          type: [string, 'null']
          description: Present when deliveryStatus is `failed`.
        sentVia:
          type: [string, 'null']
          enum: [reply, push, null]
          description: |
            Which LINE API delivered it (D-006). Backs the design's "sent to LINE" badge.
        createdAt: { type: string, format: date-time }

    DashboardSummary:
      type: object
      description: F-003 metrics only (D-020).
      required: [range, generatedAt, totalContacts, activeToday, unread, messages, recentActivity]
      properties:
        range: { type: string, enum: [today, 7d] }
        generatedAt: { type: string, format: date-time }
        timezone: { type: string, const: Asia/Bangkok }
        totalContacts: { type: integer, minimum: 0 }
        activeToday:
          type: integer
          minimum: 0
          description: Contacts with a message in either direction today (D-014).
        unread:
          type: integer
          minimum: 0
          x-pending-decision: OQ-15
          description: Unit — unread contacts or unread messages — not yet decided.
        messages:
          type: object
          required: [inbound, outbound]
          properties:
            inbound: { type: integer, minimum: 0 }
            outbound: { type: integer, minimum: 0 }
        series:
          type: array
          description: Per-day counts backing the bar chart. 7 calendar days (D-020).
          items:
            type: object
            required: [date, inbound, outbound]
            properties:
              date: { type: string, format: date }
              inbound: { type: integer, minimum: 0 }
              outbound: { type: integer, minimum: 0 }
        recentActivity:
          type: array
          items:
            type: object
            required: [conversationId, contactName, direction, at]
            properties:
              conversationId: { type: string }
              contactName: { type: string }
              direction: { $ref: '#/components/schemas/MessageDirection' }
              snippet: { type: string }
              at: { type: string, format: date-time }

# Deliberately absent, and why:
#   /contacts        — the conversation list is the contact list (F-002 item 1); a
#                      separate resource would only be needed if a contact could hold
#                      more than one conversation. See OQ-19.
#   /channels        — Facebook/WhatsApp/Web widget are inert chrome (D-018).
#   /tags, /notes,
#   /assignments     — out of scope (D-019).
#   /dashboard/export— CSV pending OQ-18.
#   topic + cohort
#   analytics        — out of scope (D-020); would require an unrecorded classifier.
