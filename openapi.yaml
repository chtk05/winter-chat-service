openapi: 3.1.0

info:
  title: WinterChat API
  version: 0.1.0-draft
  description: |
    Admin console for a LINE Official Account: read inbound messages, reply, and view
    a stats summary.

    AUTHENTICATION (D-034 … D-051, replacing D-002/D-009's shared access code):
    sign-in is two gates — LINE Login, then a shared join code (D-036). NextAuth runs in
    `apps/web`; this API is a STATELESS RESOURCE SERVER that sets no cookies at all
    (D-039). `apps/web` proxies to it server-side at `/gateway/*` and the browser never
    calls it directly (D-040, D-042), attaching a short-lived HS256 JWT as
    `Authorization: Bearer` (D-041, 120s per D-049).

    All timestamps are RFC 3339 UTC. Calendar-day boundaries for dashboard windows are
    Asia/Bangkok (D-014).

servers:
  - url: /api

tags:
  - name: auth
    description: F-001 workspace login
  - name: conversations
    description: F-002 contact list, status, search
  - name: messages
    description: F-002 thread history and sending
  - name: webhook
    description: F-002 LINE inbound
  - name: dashboard
    description: F-003 summary
  - name: sync
    description: F-002 live inbox (long-poll watermark)

security:
  - serviceToken: []

paths:
  # D-039 REMOVED /auth/login, /auth/logout and /auth/session from this API. NextAuth owns
  # them in apps/web under its own /api/auth/* basePath (D-043); this server issues no
  # session and clears none. What remains of auth here is the join gate below.

  /auth/join:
    post:
      tags: [auth]
      summary: Pass D-036's join gate and become a member
      description: |
        D-036's second gate. The caller has already proved WHO they are with LINE Login;
        this decides WHETHER they are allowed in, and records it on their `User` row
        (D-044). The code is compared in constant time against `ACCESS_CODE` (D-038); it
        does not expire and is not single-use.

        THE ONE MEMBERS-OPTIONAL ROUTE (D-046): the caller's token legitimately carries
        `member: false` here — every other route requires `member: true`. The token is
        still required and still verified; the subject joined is the token's `sub`
        (D-050), never a value from the body.

        Idempotent: a second join by the same user also answers 204.

        D-032 removed the per-IP rate limit D-011 once put on the code check, so this
        route does not answer 429. The gate sitting behind LINE Login raises the cost of
        attacking it but does not restore that protection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Compared against the ACCESS_CODE environment variable.
      responses:
        "204":
          description: |
            Joined. Membership persisted. NO Set-Cookie — this server sets no cookies
            anywhere (D-039).
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Missing, empty, or over-long code.
        "401":
          description: |
            Either no valid token, or an incorrect code. The body is identical for every
            wrong code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  error:
                    {
                      code: INVALID_ACCESS_CODE,
                      message: That access code didn't work,
                    },
                }

  /auth/membership:
    get:
      tags: [auth]
      summary: Whether the caller has passed the join gate
      description: |
        D-054. The authoritative membership read for the token's `sub` (D-050).

        This exists because `apps/web`'s Auth.js `jwt` callback must NOT trust its own
        update payload: `trigger: "update"` fires for a browser calling
        `useSession().update()`, so believing it would let any LINE-authenticated user
        grant themselves membership without the join code. `apps/web` calls this instead,
        once, immediately after a join — never per request.

        MEMBERS-OPTIONAL, like `/auth/join`: the only callers that need it hold a token
        whose `member` claim is `false`. It grants nothing and is safe in that state.
      responses:
        "200":
          description: The caller's membership, read from the database.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync:
    get:
      tags: [sync]
      summary: Wait until inbox activity is newer than `since`
      description: |
        Authenticated long-poll for the inbox. The browser never calls this directly —
        `apps/web` proxies it at `/gateway/sync` with a Bearer service token, same as
        every other route.

        Omit `since` for a snapshot of the current watermark (`changed: false`).
        Pass `since` to hang until `conversations.lastMessageAt` is newer (inbound
        LINE messages bump that column) or the wait budget expires.

        The response carries no conversation payload. A `changed: true` answer is
        only a signal to refetch `/conversations` and the open thread through the
        existing authenticated routes.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC 3339 UTC. Omit for a snapshot; pass to wait for newer activity.
      responses:
        "200":
          description: Current watermark, and whether it moved past `since`.
          content:
            application/json:
              schema:
                type: object
                required: [changed, at]
                properties:
                  changed: { type: boolean }
                  at:
                    type: [string, "null"]
                    format: date-time
                    description: Latest `lastMessageAt` across conversations, or null if none.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /conversations:
    get:
      tags: [conversations]
      summary: List conversations, most recently active first
      description: |
        F-002 items 1, 7, 8. `search` matches contact display name and message text
        (D-019). Filtering and search compose.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ConversationStatus" }
          description: Omit for the All filter.
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
          description: Empty string is treated as absent.
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: |
            Page size. Server default 30. D-048: a page is one row PER CONTACT — that
            contact's most recent conversation — not one row per conversation.
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                type: object
                required: [items, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConversationSummary" }
                  nextCursor:
                    type: [string, "null"]
                  totals:
                    type: object
                    description: Backs the list footer count line.
                    required: [matching, all, open]
                    properties:
                      matching: { type: integer }
                      all: { type: integer }
                      open: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversations]
      summary: Conversation detail for the thread header and details panel
      responses:
        "200":
          description: Conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [conversations]
      summary: Change conversation status
      description: D-019. The only mutable field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/ConversationStatus" }
      responses:
        "200":
          description: Updated conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{conversationId}/read:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [conversations]
      summary: Mark every inbound message in this conversation as read
      description: |
        D-007 — opening a thread marks all of it read. Read state is workspace-wide and
        shared across all signed-in admins (D-009). Idempotent.
      responses:
        "204": { description: Marked read. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [messages]
      summary: Thread history, newest last, paged backwards
      description: F-002 item 3. Backs the design's 'Load full history' control.
      parameters:
        - name: before
          in: query
          schema: { type: string }
          description: Cursor — return messages older than this.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
          description: |
            D-026: 30 when omitted (the initial load), 50 per page thereafter. A limit
            above 50 is REJECTED with 400 — never silently clamped, or the client would
            believe it received a full page when it did not.
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  hasMore: { type: boolean }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [messages]
      summary: Send an outbound text message
      description: |
        D-006 — attempts the LINE Reply API when an unused reply token exists, and falls
        back to Push on any error. D-010 — text only. D-013 — the message is created
        `sending` and resolves to `sent` or `failed`; the resolution reaches the client
        over Supabase Realtime (D-005), not in this response.

        `closeAfterSend` implements the design's 'Send & close' (D-019): status becomes
        `Closed` only if the send itself succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, clientId]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: |
                    Rejected when empty or whitespace-only. Upper bound is the LINE text
                    message limit.
                clientId:
                  type: string
                  format: uuid
                  description: |
                    Client-generated id for the optimistic bubble, and the idempotency
                    key — a repeat of the same clientId returns the original message
                    rather than sending twice.
                closeAfterSend:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Accepted. Message persisted with deliveryStatus `sending`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Empty text, oversized text, or missing clientId.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /messages/{messageId}/retry:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [messages]
      summary: Retry a failed outbound message
      description: D-013. Only valid from `failed`.
      responses:
        "202":
          description: Retry accepted; deliveryStatus returns to `sending`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Message is not in `failed`, or is inbound.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /line/webhook:
    post:
      tags: [webhook]
      summary: LINE Messaging API inbound webhook
      description: |
        D-012 — the `X-Line-Signature` HMAC is verified against the channel secret on
        every request. Events are deduped by LINE event id. D-010 — non-text messages
        are stored as a typed placeholder. D-013 — the contact profile is fetched on
        first contact, and a profile-API failure must not block storing the message.

        Returns 2xx promptly on accepted events so LINE does not retry.
      security: []
      parameters:
        - name: X-Line-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: LINE webhook event payload. Shape is defined by LINE, not here.
              required: [destination, events]
              properties:
                destination: { type: string }
                events: { type: array, items: { type: object } }
      responses:
        "200": { description: Events accepted, or ignored as duplicates. }
        "400": { description: Malformed payload. Not retried by LINE. }
        "401":
          {
            description: Missing,
            malformed,
            or incorrect signature. Nothing is written.,
          }

  /dashboard/summary:
    get:
      tags: [dashboard]
      summary: Stats overview
      description: |
        F-003, D-014, D-020. Only metrics F-003 specifies. Empty data yields zeros,
        never placeholders (CLAUDE.md §3.5).
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [today, 7d], default: today }
          description: Asia/Bangkok calendar days. The design's 30d range is out of scope.
      responses:
        "200":
          description: Summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        D-041: a short-lived JWT minted per call by `apps/web`'s `/gateway/*` proxy,
        signed HS256 over the shared `SESSION_SECRET` and verified here with `jose`.
        Claims are exactly `sub` (the caller's LINE user id, D-050), `member` (boolean,
        D-036) and `exp` (120s, D-049). There is no role claim — D-045 has no roles.

        This replaces the `wc_session` cookie of D-008/D-029. This server sets no cookies.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No Bearer token, or one that does not verify — malformed, bad signature, expired,
        or signed with a secret this deployment does not hold (D-041).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        D-051. Authenticated with LINE, but has not passed D-036's join gate — `code` is
        `NOT_A_MEMBER`. Distinct from 401 on purpose: signing in again would succeed and
        still not grant membership, so the client must be sent to the join screen rather
        than back to sign-in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, SCREAMING_SNAKE_CASE.
            message:
              type: string
              description: Human-readable, safe to display.
            ref:
              type: string
              description: |
                Short support reference, surfaced in the design's error cards
                ('error INVITE_INVALID · ref 4471-A').

    ConversationStatus:
      type: string
      enum: [Open, Pending, Closed]
      description: |
        D-019. D-047 fixes the server-side lifecycle: a conversation is created `Open` on
        a contact's first inbound message, and an inbound message on a `Closed`
        conversation REOPENS THAT SAME CONVERSATION as `Pending`. `Closed` is therefore
        not terminal, and `Pending` means "was finished, the contact came back". Every
        other transition is the admin's explicit act via PATCH.

    DeliveryStatus:
      type: string
      enum: [sending, sent, failed]
      description: D-013. Outbound only; inbound messages have no delivery status.

    MessageDirection:
      type: string
      enum: [inbound, outbound]

    Contact:
      type: object
      required: [id, lineUserId, displayName, firstSeenAt]
      properties:
        id: { type: string }
        lineUserId:
          type: string
          description: Shown truncated in the details panel ('U8f2c…4471').
        displayName:
          type: string
          description: |
            From the LINE profile API, cached (D-013). Falls back to the LINE user id
            when the profile fetch failed.
        avatarUrl: { type: [string, "null"], format: uri }
        firstSeenAt: { type: string, format: date-time }

    ConversationSummary:
      type: object
      description: A row in the conversation list.
      required: [id, contact, status, unread, lastMessageAt, channel]
      properties:
        id: { type: string }
        contact: { $ref: "#/components/schemas/Contact" }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        unread:
          type: boolean
          description: Drives the row's unread dot (D-007).
        unreadCount: { type: integer, minimum: 0 }
        snippet:
          type: string
          description: Text of the most recent message.
        lastMessageAt: { type: string, format: date-time }
        channel:
          type: string
          const: LINE
          description: Always LINE — other channels are inert chrome (D-018).

    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          properties:
            messageCount: { type: integer }

    Message:
      type: object
      required: [id, conversationId, direction, createdAt, messageType]
      properties:
        id: { type: string }
        conversationId: { type: string }
        clientId:
          type: [string, "null"]
          description: Echoes the sender's optimistic id so the bubble can be reconciled.
        direction: { $ref: "#/components/schemas/MessageDirection" }
        messageType:
          type: string
          description: |
            LINE message type. `text` is the only supported type; anything else is stored
            as a placeholder and rendered as unsupported (D-010).
          examples: [text, image, sticker, location]
        text:
          type: [string, "null"]
          description: Null for non-text inbound placeholders.
        deliveryStatus:
          oneOf:
            - $ref: "#/components/schemas/DeliveryStatus"
            - type: "null"
          description: Outbound only.
        failureReason:
          type: [string, "null"]
          description: Present when deliveryStatus is `failed`.
        sentVia:
          type: [string, "null"]
          enum: [reply, push, null]
          description: |
            Which LINE API delivered it (D-006). Backs the design's 'sent to LINE' badge.
        createdAt: { type: string, format: date-time }

    DashboardSummary:
      type: object
      description: F-003 metrics only (D-020).
      required:
        [
          range,
          generatedAt,
          totalContacts,
          activeToday,
          unread,
          messages,
          recentActivity,
        ]
      properties:
        range: { type: string, enum: [today, 7d] }
        generatedAt: { type: string, format: date-time }
        timezone: { type: string, const: Asia/Bangkok }
        totalContacts: { type: integer, minimum: 0 }
        activeToday:
          type: integer
          minimum: 0
          description: Contacts with a message in either direction today (D-014).
        unread:
          type: integer
          minimum: 0
          description: |
            D-027: the count of CONTACTS holding at least one unread inbound message —
            not a message count. T-019 labels the card "Unread contacts" so the unit
            cannot be misread.
        messages:
          type: object
          required: [inbound, outbound]
          properties:
            inbound: { type: integer, minimum: 0 }
            outbound: { type: integer, minimum: 0 }
        series:
          type: array
          description: Per-day counts backing the bar chart. 7 calendar days (D-020).
          items:
            type: object
            required: [date, inbound, outbound]
            properties:
              date: { type: string, format: date }
              inbound: { type: integer, minimum: 0 }
              outbound: { type: integer, minimum: 0 }
        recentActivity:
          type: array
          items:
            type: object
            required: [conversationId, contactName, direction, at]
            properties:
              conversationId: { type: string }
              contactName: { type: string }
              direction: { $ref: "#/components/schemas/MessageDirection" }
              snippet: { type: string }
              at: { type: string, format: date-time }

# Deliberately absent, and why:
#   /contacts        — the conversation list is the contact list (F-002 item 1).
#                      OQ-19 is now answered by D-048: the SCHEMA permits a contact to
#                      hold several conversations, but the list returns one row per
#                      contact and nothing recorded creates a second conversation, so
#                      this resource is still not needed. Adding it would be inventing a
#                      surface no feature asks for (§3.2).
#   /channels        — Facebook/WhatsApp/Web widget are inert chrome (D-018).
#   /tags, /notes,
#   /assignments     — out of scope (D-019).
#   /dashboard/export— CSV pending OQ-18.
#   topic + cohort
#   analytics        — out of scope (D-020); would require an unrecorded classifier.
