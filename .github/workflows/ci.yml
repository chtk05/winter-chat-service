# WinterChat — CI
name: CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck apps/api
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Typecheck apps/web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
