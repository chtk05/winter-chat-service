# WinterChat — Vercel deployment
name: Deploy to Vercel

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: "58.11.0"

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy-api:
    name: Deploy apps/api
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel environment
        run: >-
          vercel pull --yes
          --environment=${{ github.event_name == 'push' && 'production' || 'preview' }}
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: >-
          vercel build
          ${{ github.event_name == 'push' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: >-
          vercel deploy --prebuilt
          ${{ github.event_name == 'push' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}


  deploy-web:
    name: Deploy apps/web
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel environment
        run: >-
          vercel pull --yes
          --environment=${{ github.event_name == 'push' && 'production' || 'preview' }}
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: >-
          vercel build
          ${{ github.event_name == 'push' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: >-
          vercel deploy --prebuilt
          ${{ github.event_name == 'push' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
